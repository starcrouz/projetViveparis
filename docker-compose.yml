services:
  db:
    image: mysql:8.0
    container_name: viveparis-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: toto
      MYSQL_DATABASE: viveparis
    ports:
      - "3306:3306"
    volumes:
      - ./database_complet.sql:/docker-entrypoint-initdb.d/database_complet.sql
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: viveparis-web
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
